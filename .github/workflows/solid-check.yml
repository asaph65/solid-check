name: Le Gardien SOLID-Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  analyse-qualite:
    name: 🛡️ Audit de Qualité
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Récupération du code
      uses: actions/checkout@v3

    - name: 🔧 Configuration de Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'

    - name: 📦 Installation des dépendances
      run: npm ci

    - name: 🔍 Lancement de SOLID-Check
      run: npm run valider

    - name: ✅ Verdict
      if: success()
      run: echo "Code propre et validé par Le Gardien."

    - name: ❌ Verdict
      if: failure()
      run: |
        echo "::error::Le code ne respecte pas les standards SOLID/Clean Code."
        echo "Déploiement bloqué."
        exit 1
